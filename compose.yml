services:
  gateway:
    image: caddy:2-alpine
    container_name: chatapp-gateway

    ports:
      - 8080:8080

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

    depends_on:
      app:
        condition: service_started
      versitygw:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    container_name: chatapp-postgres
    env_file:
      - ./.env

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "chatapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  versitygw:
    image: versity/versitygw:latest
    container_name: chatapp-versitygw

    env_file:
      - ./.env

    volumes:
      - versitygw_data:/versity/data

    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY}
      ROOT_SECRET_KEY: ${S3_SECRET_KEY}
      VGW_CORS_ALLOW_ORIGIN: "*"

    command: --port :9000 --health /health posix /versity/data

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  whisper:
    build:
      context: ./whisper_service
      dockerfile: Dockerfile

    container_name: chatapp-whisper

    env_file:
      - ./.env

    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_WHISPER_MODEL: ${GROQ_WHISPER_MODEL:-whisper-large-v3-turbo}
      WHISPER_DEFAULT_LANGUAGE: ${WHISPER_DEFAULT_LANGUAGE:-auto}
      WHISPER_MAX_AUDIO_SIZE_BYTES: ${WHISPER_MAX_AUDIO_SIZE_BYTES:-12582912}

    ports:
      - "8000:8000"

  redis:
    image: redis:8-alpine
    container_name: chatapp-redis

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  artemis:
    image: apache/artemis:2.53.0-alpine
    container_name: chatapp-artemis

    environment:
      ANONYMOUS_LOGIN: true

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8161"]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: chatapp-app
    env_file:
      - ./.env

    volumes:
      - ./secrets:/secrets:ro

    depends_on:
      artemis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      versitygw:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: pgadmin4

    environment:
      PGADMIN_DEFAULT_EMAIL: minhnbnt@example.com
      PGADMIN_DEFAULT_PASSWORD: 12345678
      PGADMIN_CONFIG_SERVER_MODE: False

    ports:
      - 8001:80

    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
  versitygw_data:
  whisper_model_cache:
